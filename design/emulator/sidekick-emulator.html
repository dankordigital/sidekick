<title>Sidekick emulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a test bench. The device (phone or computer window, scaled to fit) beside a panel that plays the other devices.
   Tokens are the owner's Figma "Foundations" exactly. One committed dark look. */
:root{
  --page:#0a0a0a;
  --bg:#121212;--panel:#1c1c1c;--raised:#262626;--btn:#2e2e2e;
  --text:#f2f2f2;--muted:#a1a1a6;--faint:#8a8a8f;
  --ok:#45d07e;--amber:#ffc56b;--amberbg:#2f2410;--amberline:#ffc56b40;
  --blue:#5b9dff;--green:#4fcf86;--orange:#ffb84d;
  --white:#f0f0f0;--onwhite:#141414;--hair:#ffffff14;--line:#ffffff26;
  --red:#ff6b5e;
  --font:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font:14px/1.35 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0 14px;max-width:1520px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand .sk{font-weight:800;font-size:22px;letter-spacing:-.06em}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:99px}
.seg2{display:flex;gap:4px;padding:4px;border-radius:24px;background:var(--panel);border:1px solid var(--line);margin-left:auto}
.seg2 button{height:36px;padding:0 16px;border-radius:18px;border:0;background:transparent;color:var(--muted);font-weight:600}
.seg2 button[aria-pressed=true]{background:var(--white);color:var(--onwhite)}
.bench{display:flex;gap:20px;align-items:flex-start;justify-content:center;flex-wrap:wrap;max-width:1520px;margin:0 auto}
.stage{flex:1 1 420px;min-width:0;display:flex;justify-content:center}
.fit{position:relative}
.fit>.inner{position:absolute;left:0;top:0;transform-origin:0 0}
.side{flex:0 1 270px;min-width:0;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:22px;background:var(--panel);border:1px solid var(--hair)}
.side h2{margin:0;font-size:15px}
.side p{margin:0 0 4px;color:var(--muted);font-size:13px}
.sim{display:flex;align-items:center;gap:10px;min-height:42px;padding:8px 12px;border-radius:14px;border:1px solid var(--hair);background:var(--raised);text-align:left;font-weight:600;font-size:13.5px}
.sim:hover{background:var(--btn)}
.sim.quiet{background:transparent;border-color:var(--line);color:var(--muted);justify-content:center}
@media (max-width:760px){.side{flex-basis:100%}.seg2{margin-left:0}}

/* ---------- shared pieces ---------- */
.ic{display:block;flex:none}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;border:0;font-weight:600;font-size:14px;white-space:nowrap;background:var(--btn);color:var(--text);transition:transform .12s,background .15s}
.pill:active{transform:scale(.96)}
.pill.w{background:var(--white);color:var(--onwhite)}
.pill.o{background:transparent;border:1px solid var(--line)}
.pill.a{background:var(--amber);color:#241800}
.pill.ao{background:transparent;border:1px solid #ffc56b66;color:var(--amberink,#ffe2ad)}
.pill.sm{height:34px;padding:0 13px;font-size:13.5px}
.pill.lg{height:50px;border-radius:25px;font-size:15px}
.pill.blk{width:100%}
.rb{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--btn);color:var(--text)}
.rb.s{width:36px;height:36px}
.rb.ghost{background:transparent;color:var(--muted)}
.dev{position:relative;flex:none;display:grid;place-items:center;background:var(--raised);border-radius:14px}
.h1row{display:flex;align-items:center;gap:10px}
.h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;flex:none}
.h1row .h1{flex:1}
.sub{margin:0;color:var(--muted);font-size:14px}
.lbl{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin:6px 2px 0}
.card{background:var(--panel);border-radius:22px}
.st{font-size:12.5px;font-weight:500;color:var(--ok)}
.st.off{color:var(--faint)}
.chips{display:flex;gap:8px;flex:none;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:40px;padding:0 15px;border-radius:20px;border:0;background:var(--raised);color:var(--text);font-weight:500;font-size:14.5px;flex:none}
.chip[aria-pressed=true]{background:var(--white);color:var(--onwhite);font-weight:600}
.day{align-self:center;color:var(--muted);font-size:13px;font-weight:500}
.sw{position:relative;width:48px;height:28px;flex:none;border-radius:14px;border:0;padding:0;background:#3a3a3c;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.22,1,.36,1)}
.sw[aria-checked=true]{background:var(--ok)}
.sw[aria-checked=true]:after{transform:translateX(20px)}
.seg{display:flex;padding:5px;border-radius:26px;background:var(--panel);flex:none}
.seg button{flex:1;height:40px;border-radius:20px;border:0;background:transparent;color:var(--muted);font-weight:500;font-size:14.5px}
.seg button[aria-selected=true]{background:var(--white);color:var(--onwhite);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* item cards (the device history) */
.items{display:flex;flex-direction:column;gap:6px}
.it{display:flex;flex-direction:column;gap:6px;max-width:86%}
.it.me{align-self:flex-end;align-items:flex-end}
.it.them{align-self:flex-start}
.it.wide{max-width:100%;align-self:stretch}
.it .foot{color:var(--faint);font-size:12px;padding:0 2px}
.ic-card{padding:16px;border-radius:22px;background:var(--raised);display:flex;flex-direction:column;gap:10px;min-width:240px}
.me .ic-card{background:var(--white);color:var(--onwhite)}
.ic-card .row1{display:flex;gap:12px;align-items:flex-start}
.ic-card .nm{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.ic-card .sz{font-size:13px;color:var(--muted);margin-top:2px}
.me .ic-card .sz,.me .ic-card .saved{color:#555}
.ic-card .saved{font-size:13px;color:var(--text)}
.ic-card .acts{display:flex;gap:8px;flex-wrap:wrap}
.ic-card .acts .pill{height:36px;padding:0 14px;font-size:14px;background:#ffffff12}
.me .ic-card .acts .pill{background:#2a2a2a;color:#f2f2f2}
.ic-card .acts .rb{width:36px;height:36px;background:#ffffff12}
.me .ic-card .acts .rb{background:#2a2a2a;color:#f2f2f2}
.note{font-size:16px}
.otp{font:600 30px/1.1 ui-monospace,'JetBrains Mono',monospace;letter-spacing:.14em}
.ic-card .acts .pill.cc{background:var(--white);color:var(--onwhite);gap:8px;height:40px;padding:0 18px;font-weight:600}
[data-hold]{cursor:default;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .18s cubic-bezier(.22,1,.36,1)}
[data-hold].held,.pill.held{transform:scale(.96)}
.thumbs{display:flex;gap:6px}
.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:12px;display:block}
.site{font-size:19px;font-weight:700}
.path{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.req{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--amberbg);border:1px solid var(--amberline);color:#ffe2ad}
.req .k{color:var(--amber);font-size:12.5px;font-weight:600}
.req .t{color:var(--amber);font-size:15.5px}
.req .names{font-size:12.5px;color:#ffe2adb3}
.req.plain{background:var(--raised);border-color:transparent;color:var(--text)}
.req.plain .k{color:var(--muted)}
.req.plain .t{color:var(--text)}
.req.plain .names{color:var(--muted)}
.bar{height:4px;border-radius:2px;background:#ffffff1f;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:2px;background:var(--amber)}
.empty{padding:18px;border-radius:22px;background:var(--panel)}
.empty b{display:block;font-size:17px;margin-bottom:6px}
.empty span{color:var(--muted);font-size:13.5px}
.it.new{animation:pop .3s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}

/* message bar */
.mbar{display:flex;align-items:center;gap:8px;padding:7px;border-radius:32px;background:var(--panel);border:1px solid #ffffff1f;box-shadow:0 10px 30px #00000080;flex:none}
.mbar .rb{width:46px;height:46px}
.mbar input{flex:1;min-width:0;height:46px;border:0;outline:0;background:transparent;font-size:15px;padding:0 4px}
.mbar input::placeholder{color:var(--faint)}
.sendf{position:relative;display:inline-flex;align-items:center;height:46px;min-width:46px;padding:0 18px 0 44px;flex:none;border-radius:23px;border:0;background:var(--white);color:var(--onwhite);font-weight:600;font-size:14.5px;overflow:hidden;transition:padding .32s cubic-bezier(.22,1,.36,1)}
.sendf .a,.sendf .b{position:absolute;left:13px;top:13px;transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .2s}
.sendf .b{opacity:0;transform:translateY(10px) scale(.6)}
.sendf .l{display:inline-block;max-width:90px;white-space:nowrap;overflow:hidden;transition:max-width .32s cubic-bezier(.22,1,.36,1),opacity .2s}
.mbar.typing .sendf{padding:0 0 0 46px}
.mbar.typing .sendf .a{opacity:0;transform:translateY(-10px) scale(.6)}
.mbar.typing .sendf .b{opacity:1;transform:none}
.mbar.typing .sendf .l{max-width:0;opacity:0}

/* ---------- phone ---------- */
.bezel{width:414px;height:868px;padding:12px;border-radius:60px;background:#2a2a2a;box-shadow:inset 0 0 0 2px #3a3a3a,0 30px 80px #000c}
.ph{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:var(--bg)}
.status{position:absolute;left:0;right:0;top:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 32px;font-weight:600;font-size:15px;z-index:70;pointer-events:none}
.status .r{display:flex;gap:6px;align-items:center}
.batt{width:24px;height:12px;border-radius:3px;border:1.5px solid #f2f2f2aa;padding:1.5px}.batt i{display:block;height:100%;width:80%;background:#f2f2f2;border-radius:1px}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding:62px 24px 112px;overflow-y:auto;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.scr.enter{animation:enter .26s cubic-bezier(.22,1,.36,1)}
.scr.push{animation:push .32s cubic-bezier(.22,1,.36,1)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
@keyframes push{from{transform:translateX(36px);opacity:.3}}
.chat{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding:62px 24px 98px}
.chat .feed{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;scrollbar-width:none;padding-bottom:6px}
.chat .feed::-webkit-scrollbar{display:none}
.chat .feed>:first-child{margin-top:0}
.devpick{display:flex;align-items:center;gap:14px;border:0;background:none;padding:0;text-align:left;width:100%}
.devpick.card{background:var(--panel)}
.devpick .t{flex:1;min-width:0}
.devpick b{display:block;font-size:20px;font-weight:600}
.dock{position:absolute;left:16px;right:16px;bottom:22px;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:34px;background:var(--panel);border:1px solid #ffffff1f;box-shadow:0 10px 30px #00000080;transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .2s}
.dock.away{transform:translateY(140%);opacity:0;pointer-events:none}
.dk{display:flex;align-items:center;height:48px;min-width:48px;padding:0 12px;border-radius:24px;border:0;background:transparent;color:var(--text);transition:background .3s,padding .3s}
.dk span{max-width:0;overflow:hidden;white-space:nowrap;font-weight:600;font-size:15px;transition:max-width .35s cubic-bezier(.22,1,.36,1),margin .35s}
.dk.on{background:var(--white);color:var(--onwhite);padding:0 26px}
.dk.on span{max-width:96px;margin-left:10px}
.drow{display:flex;align-items:center;gap:14px;padding:14px}
.drow+.drow{padding-top:6px}
.drow .main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;border:0;background:none;padding:0;text-align:left}
.drow .main b{display:block;font-size:16px;font-weight:500}
.drow .st{display:block;margin-top:2px}
.nearby{border:1.5px dashed var(--line);border-radius:22px}
.needs{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:22px;background:var(--amberbg);border:1px solid var(--amberline)}
.needs .k{color:var(--amber);font-weight:600;font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:18px 16px;border-radius:22px;border:0;background:var(--panel);font-size:15px;text-align:left}
.selrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--raised)}
.selrow .t{flex:1;min-width:0}
.selrow b{display:block;font-weight:500;overflow-wrap:anywhere}
.selrow small{color:var(--muted);font-size:12px}
.pad{position:relative;flex:1;min-height:200px;border-radius:24px;background:var(--panel);background-image:radial-gradient(#ffffff17 1px,transparent 1.4px);background-size:22px 22px;touch-action:none;cursor:crosshair;overflow:hidden}
.pad .ptr{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;transition:box-shadow .15s}
.pad .ptr.click{box-shadow:0 0 0 14px #ffffff33}
.pad .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--faint);font-size:12.5px;pointer-events:none}
.pad .trail{position:absolute;left:16px;top:14px;color:var(--muted);font-size:12.5px;font-weight:600;pointer-events:none}
.flash{animation:flash .3s}
@keyframes flash{50%{background:var(--white);color:var(--onwhite)}}
.setrow{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border:0;background:none;width:100%;text-align:left;font-size:15px}
.setrow .t{flex:1}
.setrow .v{color:var(--muted);display:flex;align-items:center;gap:6px}
.ring{position:relative;align-self:center;width:210px;height:210px}
.ring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:40px;font-weight:700;letter-spacing:-.02em}
.codebox{display:flex;gap:8px;position:relative;justify-content:space-between}
.codebox span{flex:1;height:54px;border-radius:14px;background:var(--panel);border:1px solid #ffffff1f;display:grid;place-items:center;font-size:22px;font-weight:600}
.codebox span.cur{border:2px solid var(--white)}
.codebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.codebox.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pingrings{position:relative;width:250px;height:250px;display:grid;place-items:center}
.pingrings i{position:absolute;inset:0;border-radius:50%;border:2px solid #ffc56b66;animation:ring 2.6s ease-out infinite}
.pingrings i:nth-child(2){animation-delay:.85s}.pingrings i:nth-child(3){animation-delay:1.7s}
@keyframes ring{0%{transform:scale(.45);opacity:1}100%{transform:scale(1.15);opacity:0}}
.bar2{position:absolute;left:16px;right:16px;bottom:22px;z-index:31;display:flex;gap:8px;padding:7px;border-radius:32px;background:var(--panel);border:1px solid #ffffff1f;box-shadow:0 10px 30px #00000080}
.bar2 .pill{flex:1;height:48px;border-radius:24px;justify-content:flex-start;padding:0 18px}
.full{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;gap:14px;padding:62px 24px 30px;overflow-y:auto;scrollbar-width:none}
.full::-webkit-scrollbar{display:none}
.full.anim{animation:push .32s cubic-bezier(.22,1,.36,1)}
.full.rise{animation:up .34s cubic-bezier(.22,1,.36,1)}

/* sheets, dialogs and notices */
.back{position:absolute;inset:0;z-index:40;background:#000c;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:41;display:flex;flex-direction:column;gap:10px;padding:20px 18px 20px;border-radius:30px;background:var(--panel);animation:up .32s cubic-bezier(.22,1,.36,1);max-height:88%;overflow-y:auto}
.sheet.grab{padding-top:12px}
.sheet .gr{align-self:flex-start;width:36px;height:4px;border-radius:2px;background:#ffffff33;margin:4px 0 8px}
@keyframes up{from{transform:translateY(100%)}}
.shead{display:flex;align-items:flex-start;gap:12px}.shead>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}.shead .sub2{margin:0!important}
.sheet{touch-action:pan-x}.sheet.drag{animation:none;transition:none}.sheet.snap{transition:transform .25s cubic-bezier(.22,1,.36,1)}.sheet.gone{transform:translateY(110%)!important;transition:transform .2s ease-in}
.sheet h3,.dlg h3{margin:0;font-size:17px;font-weight:600}
.sheet .sub2,.dlg .sub2{margin:-4px 0 2px;color:var(--muted);font-size:13px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 16px;border-radius:23px;border:0;background:var(--raised);text-align:left;font-weight:500;font-size:14.5px}
.opt.w{background:var(--white);color:var(--onwhite);font-weight:600}
.opt[disabled]{color:var(--faint);opacity:1}
.foot2{color:var(--faint);font-size:12px;margin-top:2px}
.viewer img{width:100%;border-radius:16px;display:block}
.notices{position:absolute;left:12px;right:12px;bottom:100px;z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.notices.low{bottom:96px}
.notices.onchat{bottom:168px}
.notice{pointer-events:auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:14px 12px 16px 16px;border-radius:20px;background:var(--panel);border:1px solid #ffffff1f;box-shadow:0 10px 30px #00000080;animation:up2 .3s cubic-bezier(.22,1,.36,1);font-size:14.5px}
.notice .t{flex:1;min-width:0}
.notice small{display:block;color:var(--text);font-size:14px}
.notice .x{width:40px;height:40px;border-radius:50%;border:0;background:var(--btn);display:grid;place-items:center;flex:none}
.notice .life{position:absolute;left:16px;right:70px;bottom:7px;height:2px;border-radius:1px;background:#ffffff26;overflow:hidden}
.notice .life i{display:block;height:100%;background:#ffffff99;animation:life linear forwards}
.notice{touch-action:none}
.notice.out{opacity:0;transform:translateY(8px);transition:.25s}
.notice.drag{transition:none}
.notice.gone{opacity:0;transform:translateY(120%)!important;transition:.22s}
@keyframes up2{from{opacity:0;transform:translateY(12px)}}
@keyframes life{from{width:100%}to{width:0}}
.pop{position:absolute;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:#000c;animation:fade .2s}
.dlg{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:26px;background:var(--panel);animation:pop .25s}
.dlg ol{margin:0;padding-left:20px;line-height:1.5}

/* ---------- computer ---------- */
.win{width:1280px;height:800px;border-radius:14px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px #ffffff1f,0 30px 80px #000c;display:flex;flex-direction:column;position:relative}
.wbar{height:38px;flex:none;display:flex;align-items:center;gap:16px;padding:0 14px;font-size:13px;color:var(--muted)}
.wbar .l{display:flex;gap:8px}.wbar .l i{width:12px;height:12px;border-radius:50%;background:#3a3a3c;display:block}
.wbar .r{margin-left:auto}
.wbody{flex:1;min-height:0;display:flex;gap:12px;padding:0 12px 12px}
.rail{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-radius:22px;background:var(--panel)}
.rail .logo{font-weight:800;font-size:29px;letter-spacing:-.07em;margin-bottom:14px;line-height:1}
.rail button{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;color:var(--muted);font-size:10.5px;padding:6px 0;width:60px}
.rail button .c{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.rail button[aria-current=true] .c{background:var(--white);color:var(--onwhite)}
.rail button[aria-current=true]{color:var(--text)}
.col{width:300px;flex:none;display:flex;flex-direction:column;gap:10px;padding:16px 14px;border-radius:22px;background:var(--panel);overflow-y:auto;scrollbar-width:none}
.col::-webkit-scrollbar{display:none}
.col h2{margin:0;font-size:20px;font-weight:600;flex:1}
.wrow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;border:0;background:none;text-align:left;width:100%}
.wrow:hover{background:#ffffff08}
.wrow[aria-current=true]{background:var(--raised)}
.wrow .t{flex:1;min-width:0}
.wrow b{display:flex;font-weight:500;font-size:14.5px}
.wrow b em{margin-left:auto;font-style:normal;color:var(--faint);font-size:12px;font-weight:400}
.wrow small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;padding:20px 24px;border-radius:22px;background:var(--panel);position:relative;overflow:hidden}
.wmain .feed{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.wmain .feed::-webkit-scrollbar{display:none}
.wmain .it{max-width:62%}
.wmain .it.wide{max-width:560px;align-self:flex-start}
.drop{position:absolute;inset:8px;border-radius:20px;border:2px dashed var(--white);background:#121212e6;display:none;place-items:center;z-index:5;font-size:20px;font-weight:600;pointer-events:none}
.wmain.dragging .drop{display:grid}
.wnot{position:absolute;right:24px;bottom:24px;width:380px;z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ---------- small renderers ---------- */
function dev(k,s=48,o={}){const d=S.D[k];const col=d.reach||!d.paired?d.color:'var(--faint)';
  return `<span class="dev" style="width:${s}px;height:${s}px;border-radius:${Math.round(s*.3)}px;${o.bg?'background:'+o.bg:''}">${ic(d.kind,Math.round(s*.46),col)}</span>`}
const statusTxt=k=>{const d=S.D[k];return d.reach?`${d.via} · encrypted`:`Not reachable · open Sidekick on this device`};

function lastOf(v,k){const h=hist(v,k);const m=h[h.length-1];if(!m)return['Nothing sent yet',''];
  const who=m.from==='me'?'You sent ':'Received ';

  return[s,m.day==='Today'?m.when:m.day.slice(0,3)]}

function itemHTML(v,k,m){
  const d=S.D[k];const nw=m.fresh?' new':'';m.fresh=false;
  const foot=`<span class="foot">${m.from==='me'?'You sent':'From '+esc(d.name)} · ${esc(m.when)}</span>`;

  if(m.t==='note'){const c=codeOf(m.text);if(c&&m.from!=='me')return `<div class="it ${who}${nw}"><div class="ic-card" ${H}><div class="note">${esc(m.text)}</div><div class="otp" aria-label="Code ${c.split('').join(' ')}">${esc(c)}</div><div class="acts"><button type="button" class="pill w cc" data-act="copyCode" data-code="${esc(c)}">${ic('copy',18)}Copy code</button></div></div>${foot}</div>`;

  if(m.t==='file'){

    const saved=m.from==='me'?(sending?`<span data-pt="${m.id}">${Math.round(m.p*100)}%</span> · sending`:'Delivered ✓'):`Saved to ${esc(S.set[v].save)}`;

    return `<div class="it ${who}${nw}"><div class="ic-card" ${H}><div class="row1">${ic(kindOf(m.name)==='file'?'file':'photo',24)}<div style="min-width:0"><div class="nm">${esc(m.name)}</div><div class="sz">${fmt(m.size)}</div></div></div><div class="saved">${saved}</div>${bar}${sending?'':`<div class="acts"><button type="button" class="pill" data-act="openFile" data-id="${m.id}">Open</button><button type="button" class="pill" data-act="showFolder" data-id="${m.id}">Show in folder</button></div>`}</div>${foot}</div>`}

    return `<div class="it ${who}${nw}"><div class="ic-card" ${H}><div class="thumbs">${m.items.map(x=>`<img src="${MEDIA[x[2]]}" alt="${esc(x[0])}">`).join('')}</div><div><div class="nm" style="font-weight:500">${n} photo${n>1?'s':''}${vd?', '+vd+' video':''}</div><div class="saved" style="margin-top:6px">${m.from==='me'?'Delivered ✓':'Saved to Photos'}</div></div><div class="acts"><button type="button" class="pill" data-act="openPhotos" data-id="${m.id}">Open photos</button></div></div>${foot}</div>`}
  if(m.t==='req'){
    const total=m.files.reduce((a,f)=>a+f[1],0),n=m.files.length;const names=m.files.map(f=>esc(f[0])).join(' · ');
    if(m.status==='waiting')return `<div class="it them wide${nw}"><div class="req"><span class="k">Waiting for you</span><span class="t">${esc(d.name)} wants to send you ${n} files · ${fmt(total)}</span><span class="names">${names}</span><div style="display:flex;gap:8px;margin-top:4px"><button type="button" class="pill o" style="border-color:#ffc56b55;color:#ffe2ad" data-act="decline" data-v="${v}" data-k="${k}" data-id="${m.id}">Decline</button><button type="button" class="pill a" data-act="accept" data-v="${v}" data-k="${k}" data-id="${m.id}">Accept</button></div></div>${foot}</div>`;

    if(m.status==='declined')return `<div class="it them wide"><div class="req plain"><span class="k">Transfer declined</span><span class="t">${esc(d.name)} wants to send you ${n} files · ${fmt(total)}</span><span class="names">${names}</span></div>${foot}</div>`;

}
function feedHTML(v,k){

  const F={all:()=>true,files:m=>m.t==='file'||m.t==='req',photos:m=>m.t==='photos',links:m=>m.t==='link',notes:m=>m.t==='note'};
  list=list.filter(F[st.filter]);
  if(st.q){const q=st.q.toLowerCase();list=list.filter(m=>JSON.stringify([m.text,m.url,m.name,m.files,m.items]).toLowerCase().includes(q))}
  let h='';
  if(!d.reach&&d.paired)h+=`<div class="empty" style="background:var(--raised)"><b>${esc(d.name)} isn't reachable</b><span>Keep both devices on the same Wi-Fi and open Sidekick. Your sent items are still here.</span><div style="margin-top:12px"><button type="button" class="pill w sm" data-act="tryAgain" data-k="${k}">Try again</button></div></div>`;
  if(!hist(v,k).length)return h+`<div class="empty"><b>Nothing here yet.</b><span>Send ${esc(d.name)} a file, a photo or a link and it'll show up here.</span></div>`;

  let day='';
  for(const m of list){if(m.day!==day){day=m.day;h+=`<div class="day">${esc(day)}</div>`}h+=itemHTML(v,k,m)}

function mbar(v,k){const typing=S[v].draft.trim();const d=S.D[k];

  const chips=`<div class="chips" role="group" aria-label="Show">${[['all','All'],['files','Files'],['photos','Photos'],['links','Links'],['notes','Notes']].map(([f,t])=>`<button type="button" class="chip" aria-pressed="${st.filter===f}" data-act="filter" data-f="${f}">${t}</button>`).join('')}</div>`;

/* ---------- notices ---------- */
/* one notice at a time: a new one waits; the one showing then leaves 3 s later (or at once on ✕ / swipe) */
const NQ={phone:{q:[],cur:null},pc:{q:[],cur:null}};
function notice(title,sub,o={}){const v=S.view,N=NQ[v];N.q.push({title,sub,o});if(N.cur)N.cur.hurry();else showNotice(v)}
function showNotice(v){const N=NQ[v];const n=N.q.shift();if(!n)return;
  const box=document.getElementById(v==='phone'?'ph-notices':'pc-notices');if(v==='phone')noticePlace();
  const ms=n.o.long?9000:5000;const el=document.createElement('div');el.className='notice';
  el.innerHTML=`<div class="t">${esc(n.title)}${n.sub?'<small>'+esc(n.sub)+'</small>':''}</div><button type="button" class="x" aria-label="Close">${ic('close',18)}</button><span class="life"><i style="animation-duration:${ms}ms"></i></span>`;
  const bar=el.querySelector('.life i');let t,ends=Date.now()+ms,over=false,hurried=false,done=false;
  const finish=()=>{if(done)return;done=true;clearTimeout(t);if(N.cur&&N.cur.el===el)N.cur=null;setTimeout(()=>{el.remove();if(!N.cur)showNotice(v)},260)};
  const kill=()=>{el.classList.add('out');finish()};
  const runFor=ms2=>{clearTimeout(t);ends=Date.now()+ms2;const f=bar.getBoundingClientRect().width/Math.max(1,bar.parentNode.getBoundingClientRect().width);bar.style.animation='none';bar.style.transition='none';bar.style.width=(f*100)+'%';void bar.offsetWidth;bar.style.transition=`width ${ms2}ms linear`;bar.style.width='0%';t=setTimeout(kill,ms2)};
  const pause=()=>{clearTimeout(t);const w=getComputedStyle(bar).width;bar.style.transition='none';bar.style.width=w;bar.style.animationPlayState='paused'};
  const resume=()=>runFor(hurried?Math.min(3000,Math.max(1200,ends-Date.now())):2500);
  N.cur={el,hurry(){if(hurried)return;hurried=true;if(!over&&!y0)runFor(Math.min(3000,Math.max(0,ends-Date.now())))}};
  el.querySelector('.x').onclick=kill;t=setTimeout(kill,ms);
  el.onpointerenter=()=>{over=true;pause()};
  el.onpointerleave=()=>{over=false;if(!y0&&!done)resume()};
  /* swipe it down to close it */
  let y0=0,dy=0;
  el.addEventListener('pointerdown',e=>{if(e.target.closest('.x'))return;y0=e.clientY;dy=0;pause();el.classList.add('drag');el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(!y0)return;dy=Math.max(0,e.clientY-y0);el.style.transform=`translateY(${dy}px)`;el.style.opacity=String(Math.max(.2,1-dy/120))});
  const end=()=>{if(!y0)return;y0=0;el.classList.remove('drag');if(dy>36){el.classList.add('gone');finish()}else{el.style.transform='';el.style.opacity='';if(!over)resume()}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  box.appendChild(el);
}

/* ---------- transfers ---------- */
const jobs=[];
function job(o,bytes,done,tick){o.p=0;jobs.push({o,step:Math.min(.12,Math.max(.012,14e6/Math.max(bytes,1)/10)),done,tick})}
setInterval(()=>{for(let i=jobs.length-1;i>=0;i--){const j=jobs[i];if(j.o.cancel){jobs.splice(i,1);continue}
  j.o.p=Math.min(1,j.o.p+j.step*(.7+Math.random()*.6));
  document.querySelectorAll(`[data-p="${j.o.id}"]`).forEach(e=>e.style.width=(j.o.p*100)+'%');
  document.querySelectorAll(`[data-pt="${j.o.id}"]`).forEach(e=>e.textContent=Math.round(j.o.p*100)+'%');
  document.querySelectorAll(`[data-pt2="${j.o.id}"]`).forEach(e=>{const t=j.o.files.reduce((a,f)=>a+f[1],0);e.textContent=`${fmt(t*j.o.p)} of ${fmt(t)} · ${Math.round(j.o.p*100)}%`});
  if(j.tick)j.tick();if(j.o.p>=1){jobs.splice(i,1);j.done()}}},100);

function accept(v,k,id){const m=hist(v,k).find(x=>x.id===id);if(!m||m.status!=='waiting')return;
  m.status='receiving';const total=m.files.reduce((a,f)=>a+f[1],0);
  job(m,total,()=>{const h=hist(v,k);const i=h.indexOf(m);const ph=m.files.filter(f=>kindOf(f[0])!=='file').map(f=>[f[0],f[1],PHOTOS.find(p=>p[0]===f[0])?.[2]||'beach']);const fl=m.files.filter(f=>kindOf(f[0])==='file');
    const add=[];if(ph.length)add.push({id:nid(),t:'photos',from:'them',items:ph,day:m.day,when:m.when});fl.forEach(f=>add.push({id:nid(),t:'file',from:'them',name:f[0],size:f[1],state:'done',day:m.day,when:m.when}));
    h.splice(i,1,...add);render();if(S.view===v)notice(`Received ${m.files.length} files from ${S.D[k].name}`,`Saved to ${S.set[v].save}`)});
  render()}
function decline(v,k,id){const m=hist(v,k).find(x=>x.id===id);if(m)m.status='declined';render()}
function waiting(v){const out=[];devsFor(v).forEach(k=>hist(v,k).forEach(m=>{if(m.t==='req'&&m.status==='waiting')out.push({k,m})}));return out}
function sendItems(v,k,list){const d=S.D[k];
  if(!d.reach){S[v].pop={t:'error',k};render();return}
  const h=hist(v,k);
  list.forEach(f=>{if(f.note){h.push(isLink(f.note)?{id:nid(),t:'link',from:'me',url:f.note,day:'Today',when:now(),fresh:true}:{id:nid(),t:'note',from:'me',text:f.note,day:'Today',when:now(),fresh:true});return}
    if(f.photos){h.push({id:nid(),t:'photos',from:'me',items:f.photos,day:'Today',when:now(),fresh:true});return}
    const m={id:nid(),t:'file',from:'me',name:f.name,size:f.size,state:'sending',p:0,day:'Today',when:now(),fresh:true};h.push(m);
    job(m,f.size,()=>{m.state='done';render()})});
  stick=true;render()}

  <p class="sub" style="font-size:12.5px">Sidekick 4.0 · No account. No cloud. Nothing leaves your devices.</p></div>`}
function connectBody(c,v){
  const segs=[['nearby','Nearby'],['qr','QR code'],['code','Code']].map(([k,t])=>`<button type="button" role="tab" aria-selected="${c.mode===k}" data-act="cmode" data-m="${k}">${t}</button>`).join('');
  let b='';

    b=`<div class="card" style="padding:18px"><b style="font-size:17px;font-weight:600">Ready to connect</b><p class="sub" style="font-size:13.5px;margin-top:6px">Only nearby devices running Sidekick appear here.</p></div>${nb.length?nb.map(k=>`<div class="nearby"><div class="drow">${dev(k,44)}<div style="flex:1;min-width:0"><b style="font-weight:500;font-size:15.5px">${esc(S.D[k].name)}</b><span class="st off" style="display:block">${esc(S.D[k].via)}</span></div><button type="button" class="pill o sm" data-act="pair" data-k="${k}">Pair</button></div></div>`).join(''):`<div class="empty"><span>Looking for devices on this Wi-Fi…</span></div>`}<button type="button" class="pill o blk" style="justify-content:flex-start" data-act="refresh">Refresh</button>`}
  else if(c.mode==='qr')b=`<div style="background:var(--white);border-radius:24px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--onwhite)">${qr()}<span style="text-align:center;font-size:13.5px">Open Sidekick on your other device<br>and scan this code.</span></div>${v==='phone'?`<button type="button" class="pill o blk" style="justify-content:flex-start" data-act="scanSheet">Scan a code instead</button>`:''}<span class="sub" style="font-size:13px">Or enter this code on your other device</span><div class="codebox">${'847291'.split('').map(x=>`<span>${x}</span>`).join('')}</div>`;
  else{const tg=S.D[c.target||(v==='phone'?'studio':'tab')];
    b=`<div class="card" style="padding:18px"><b style="font-size:17px;font-weight:600">Enter their code</b><p class="sub" style="font-size:13.5px;margin-top:6px">Find the six-digit code in Sidekick on ${esc(tg?tg.name:'your other device')}.</p></div><div class="codebox" id="codebox">${[0,1,2,3,4,5].map(i=>`<span class="${i===c.code.length?'cur':''}">${esc(c.code[i]||'')}</span>`).join('')}<label class="sr" for="code-in">Six-digit code</label><input id="code-in" inputmode="numeric" maxlength="6" autocomplete="one-time-code" data-code value="${esc(c.code)}"></div><button type="button" class="pill w blk" data-act="doConnect" ${c.code.length===6?'':'disabled'}>Connect</button><span class="sub" style="font-size:12.5px">For this emulator, any six digits work.</span>`}
  return `<div class="seg" role="tablist" aria-label="Ways to connect">${segs}</div>${b}<p class="sub" style="font-size:12.5px;margin-top:auto">Your devices connect directly.<br>Nothing is sent to the cloud.</p>`}
function qr(){let s=190,n=25,c=s/n,o='';let seed=11;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const f=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#141414"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#f0f0f0"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#141414"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))continue;if(r()<.5)o+=`<rect x="${(x*c).toFixed(1)}" y="${(y*c).toFixed(1)}" width="${c.toFixed(1)}" height="${c.toFixed(1)}" fill="#141414"/>`}
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" role="img" aria-label="Pairing QR code">${f(0,0)}${f(18,0)}${f(0,18)}${o}</svg>`}
const FS={'':[['Camera','dir','42 items'],['Documents','dir','8 items'],['Weekend plans.pdf',2.4e6,'Today'],['Shopping list.txt',4e3,'Yesterday'],['IMG_2401.heic',8.2e6,'Yesterday']],
  'Camera':[['IMG_2398.heic',7.1e6,'Mon'],['IMG_2399.heic',6.6e6,'Mon'],['Clip.mov',61e6,'Sun']],'Documents':[['Travel checklist.pdf',2.4e6,'Tue'],['Lease.pdf',820e3,'Oct']]};
function browseBody(v){const b=S[v].browse;const d=S.D[b.dev];const key=b.path.join('/');
  const L=(FS[key]||(FS[key]=[])).filter(x=>!b.q||x[0].toLowerCase().includes(b.q.toLowerCase()));
  const crumbs=[d.name,'Files','Downloads'].concat(b.path).join(' › ');
  const rows=L.length?L.map(([n,s,w])=>s==='dir'?`<button type="button" class="drow" style="width:100%;border:0;background:none;text-align:left" data-act="openDir" data-v="${v}" data-n="${esc(n)}">${ic('folder',22)}<span style="flex:1;min-width:0"><b style="display:block;font-weight:500">${esc(n)}</b><span class="sub" style="font-size:12.5px">Folder · ${esc(w)}</span></span>${ic('right',18,'var(--faint)')}</button>`:`<div class="drow">${ic(kindOf(n)==='file'?'file':'photo',22)}<span style="flex:1;min-width:0"><b style="display:block;font-weight:500;overflow-wrap:anywhere">${esc(n)}</b><span class="sub" style="font-size:12.5px">${fmt(s)} · ${esc(w)}</span></span><button type="button" class="rb s ghost" aria-label="Download ${esc(n)}" data-act="download" data-n="${esc(n)}">${ic('download',20)}</button></div>`).join(''):`<div class="drow sub">This folder is empty</div>`;
  return {d,crumbs,rows,count:L.length}}

function sendingView(s,v){const d=S.D[s.to];const tot=s.items.reduce((a,f)=>a+(f.size||2e3),0);const r=80,C=2*Math.PI*r;const done=s.state==='done';
  return `<div class="h1row"><button type="button" class="rb" aria-label="Back" data-act="${done?'closeSending':'hideSending'}">${ic('back',20)}</button><h1 class="h1">Sending</h1></div><div style="display:flex;align-items:center;gap:14px">${dev(s.to,48)}<div><b style="font-size:19px;font-weight:600">${esc(d.name)}</b><span class="st" style="display:block">${esc(statusTxt(s.to))}</span></div></div>
  <div class="ring"><svg width="210" height="210" viewBox="0 0 210 210" aria-hidden="true"><circle cx="105" cy="105" r="${r}" fill="none" stroke="#262626" stroke-width="10"/><circle id="ring-${v}" cx="105" cy="105" r="${r}" fill="none" stroke="${done?'var(--ok)':'#f0f0f0'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C*s.p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 105 105)"/></svg><div>${done?ic('check',56,'var(--ok)',2.6)+'<span class="sub" style="margin-top:6px">Sent</span>':`<b data-pt="${s.id}">${Math.round(s.p*100)}%</b><span class="sub" style="font-size:12.5px" id="eta-${v}">${s.p>.9?'Less than a second left':'About 2 seconds left'}</span>`}</div></div>
  <div style="text-align:center;font-size:15px" id="of-${v}">${fmt(tot*s.p)} of ${fmt(tot)} · 12 MB/s</div>
  <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:14px">${s.items.map(f=>`<div><div>${esc(f.name)}</div><div class="sub" style="font-size:12.5px;margin:4px 0 8px">${f.size?fmt(f.size):'Note'}${done?' · sent ✓':''}</div><div class="bar" style="height:3px"><i data-p="${s.id}" style="width:${done?100:s.p*100}%;background:var(--white)"></i></div></div>`).join('')}</div>
  ${done?`<button type="button" class="pill w lg blk" data-act="closeSending">Done</button>`:`<button type="button" class="pill o lg blk" data-act="stopSending">Stop</button>`}`}
function pingView(v){const k=S[v].ping;const d=S.D[k];

function setupPads(){['ph-pad','pc-pad'].forEach(id=>{const pad=document.getElementById(id);if(!pad||pad.dataset.ok)return;pad.dataset.ok=1;
  const ptr=pad.querySelector('.ptr');let down=null,moved=0;
  const pos=e=>{const r=pad.getBoundingClientRect();return[(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]};
  pad.addEventListener('pointerdown',e=>{down=pos(e);moved=0;pad.setPointerCapture(e.pointerId)});
  pad.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);moved++;ptr.style.left=Math.max(3,Math.min(97,p[0]))+'%';ptr.style.top=Math.max(3,Math.min(97,p[1]))+'%'});
  pad.addEventListener('pointerup',()=>{if(down&&moved<3){ptr.classList.add('click');setTimeout(()=>ptr.classList.remove('click'),180);trail('Click')}down=null})})}

  pop(){S.phone.stack.pop();render()},
  cmode(e){const c=V().connect;c.mode=e.dataset.m;c.code='';render();if(c.mode==='code')setTimeout(()=>{const i=document.getElementById('code-in');if(i)i.focus()},40)},
  pair(e){const st=V();st.connect={mode:'code',code:'',target:e.dataset.k};if(S.view==='phone')st.stack=['connect'];render();setTimeout(()=>{const i=document.getElementById('code-in');if(i)i.focus()},300)},
  refresh(e){e.textContent='Looking…';setTimeout(()=>{render();notice('Up to date','Only devices on your Wi-Fi appear here')},900)},
  doConnect(){const st=V();const c=st.connect;const k=c.target||(S.view==='phone'?'studio':'tab');const d=S.D[k];d.paired=true;d.reach=true;
    st.connect=null;if(S.view==='phone'){st.stack=[];st.tab='chat'}else st.tab='devices';st.chat=k;st.filter='all';render();notice('Paired with '+d.name,'Everything between you is encrypted')},
  scanSheet(){V().sheet={t:'scan'};render()},
  useSample(){const st=V();st.sheet=null;st.connect.code='847291';st.connect.target=st.connect.target||'studio';A.doConnect()},
  enterCode(){const st=V();st.sheet=null;st.connect.mode='code';render()},
  browse(){const st=V();const k=st.chat;st.sheet=null;if(!S.D[k].reach){st.pop={t:'error',k};render();return}if(S.view==='phone'){st.browse={dev:k,path:[],q:''};st.stack=['browse']}else{st.tab='files';st.browse={dev:k,path:[],q:''}}render()},
  wbrowse(e){S.pc.browse={dev:e.dataset.k,path:[],q:''};render()},
  openDir(e){const b=V().browse;b.path.push(e.dataset.n);b.q='';render()},
  up(){const b=V().browse;b.path.pop();b.q='';render()},
  download(e){V().sheet={t:'downloaded',name:e.dataset.n};render()},
  downloadAll(){V().sheet={t:'downloaded',name:'Everything in this folder'};render()},
  uploadHere(){V().sheet={t:'files',target:'upload'};render()},
  pingOut(){const st=V();const k=st.chat;st.sheet=null;if(!S.D[k].reach){st.pop={t:'error',k};render();return}st.pop={t:'pinging',k};render()},
  remoteOf(){const st=V();st.remote=st.chat;st.sheet=null;if(S.view==='phone')st.tab='remote';else st.tab='remote';render()},
  favT(){const d=S.D[V().chat];d.fav=!d.fav;close();render();notice(d.fav?'Added to Favorites':'Removed from Favorites',d.name)},
  clearHist(){S.H[S.view+':'+V().chat]=[];close();render()},
  attach(){V().sheet={t:'attach'};render()},
  composeBtn(e){const v=e.dataset.v;if(S[v].draft.trim()){sendText(v,S[v].draft);const i=document.getElementById('msg-'+v);if(i)i.focus()}else{S[v].sheet={t:'files',target:'chat'};render()}},
  pickFiles(e){V().sheet={t:'files',target:e.dataset.target||'chat'};render()},
  pickPhotos(e){V().sheet={t:'photos',target:e.dataset.target||'chat'};render()},
  pasteChat(){V().sheet={t:'paste'};render()},
  sendPasted(){close();sendItems(S.view,V().chat,[{note:'https://www.bbcgoodfood.com/recipes/lemon-drizzle-cake'}])},
  addFiles(e){const st=V();const t=e.dataset.target;close();
    if(t==='send'){st.sel.push(...SAMPLE_FILES.map(f=>({...f})));render()}
    else if(t==='upload'){const b=st.browse;const key=b.path.join('/');(FS[key]||(FS[key]=[])).unshift(['Trail photos.zip',45.3e6,'Just now'],['Weekend plans.pdf',2.4e6,'Just now']);render();notice('Uploaded 2 files','to '+S.D[b.dev].name)}
    else startSend(S.view,st.chat,SAMPLE_FILES)},
  addPhotos(e){const st=V();close();const item={name:'2 photos, 1 video',size:125.6e6,photos:PHOTOS.slice()};if(e.dataset.target==='send'){st.sel.push(item);render()}else startSend(S.view,st.chat,[item])},
  textSheet(){V().sheet={t:'text'};render();setTimeout(()=>{const t=document.getElementById('text-in');if(t)t.focus()},300)},
  addText(){const t=(document.getElementById('text-in').value||'').trim()||'bbcgoodfood.com/recipes/lemon-drizzle-cake';V().sel.push({name:t.length>34?t.slice(0,34)+'…':t,note:t});close();render()},
  pasteSel(){V().sel.push({name:'bbcgoodfood.com',note:'https://www.bbcgoodfood.com/recipes/lemon-drizzle-cake'});render();notice('Pasted','The link waits in your selection')},
  unsel(e){V().sel.splice(+e.dataset.i,1);render()},
  clearSel(){V().sel=[];render()},
  sendSel(e){const st=V();startSend(S.view,e.dataset.k,st.sel)},
  hideSending(){const st=V();const s=st.sending;st.sending=null;render();if(s&&s.state==='going')notice('Still sending in the background','to '+S.D[s.to].name)},
  closeSending(){const st=V();const s=st.sending;st.sending=null;if(s){st.chat=s.to;st.filter='all';if(S.view==='phone')st.tab='chat';else st.tab='devices'}stick=true;render()},
  stopSending(){const st=V();if(st.sending)st.sending.cancel=true;st.sending=null;render();notice('Stopped','Nothing half-sent was kept')},
  itemMenu(e){V().sheet={t:'menu',id:e.dataset.id};render()},
  menuOpen(e){const m=find(S.view,e.dataset.id);if(!m)return;if(m.t==='note')V().sheet={t:'note',text:m.text};else if(m.t==='link'){close();openURL(m.url)}else if(m.t==='photos')V().sheet={t:'viewer',items:m.items,i:0};else V().sheet={t:'filePreview',name:m.name};render()},
  openFile(e){const m=find(S.view,e.dataset.id);V().sheet={t:'filePreview',name:m.name};render()},
  openPhotos(e){const m=find(S.view,e.dataset.id);V().sheet={t:'viewer',items:m.items,i:0};render()},
  vprev(){const sh=V().sheet;sh.i=(sh.i+sh.items.length-1)%sh.items.length;render()},
  vnext(){const sh=V().sheet;sh.i=(sh.i+1)%sh.items.length;render()},
  showFolder(e){const m=find(S.view,e.dataset.id);V().sheet={t:'folder',name:m?(m.name||'2 photos, 1 video'):''};render()},
  showFolderN(e){V().sheet={t:'folder',name:e.dataset.n};render()},
  copy(e){const m=find(S.view,e.dataset.id);const t=m?((m.t==='note'&&m.from!=='me'&&codeOf(m.text))||m.text||m.url||m.name||''):'';clip(t);close();render()},
  copyText(e){clip(e.dataset.text);close();render()},
  copyCode(e){clip(e.dataset.code);held(e)},
  openLink(e){const m=find(S.view,e.dataset.id);if(m)openURL(m.url)},
  sendAgain(e){const m=find(S.view,e.dataset.id);close();if(!m)return;const it=m.t==='note'?{note:m.text}:m.t==='link'?{note:m.url}:m.t==='photos'?{name:'Photos',size:125.6e6,photos:m.items}:{name:m.name,size:m.size};
    if(m.t==='note'||m.t==='link'){sendItems(S.view,V().chat,[it])}else startSend(S.view,V().chat,[it])},
  removeItem(e){const h=hist(S.view,V().chat);const i=h.findIndex(x=>x.id===e.dataset.id);if(i>=0)h.splice(i,1);close();render();notice('Removed from this list','The file itself wasn\'t touched')},
  remotePick(){V().sheet={t:'remotePick'};render()},
  setRemote(e){const st=V();st.remote=e.dataset.k;st.sheet=null;render();const d=S.D[e.dataset.k];if(S.view==='pc'&&!d.control)notice(/iPhone/.test(d.name)?'iPhones can\'t be controlled':'This device can\'t be controlled','Choose a computer to use the touchpad')},
  click(e){e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');trail(e.dataset.w)},
  key(e){e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');trail('Pressed '+e.dataset.w)},
  kbSheet(){S.phone.sheet={t:'kb'};render();setTimeout(()=>{const i=document.getElementById('kb-in');if(i)i.focus()},300)},
  kbSend(){const t=document.getElementById('kb-in').value;close();render();if(t){trail('Typed “'+t.slice(-24)+'”')}},
  kbFocus(){const i=document.getElementById('kb-pc');if(i)i.focus()},
  kbSendPc(){const i=document.getElementById('kb-pc');if(i&&i.value){trail('Typed “'+i.value.slice(-24)+'”');i.value=''}},
  toggle(e){const s=S.set.phone;s[e.dataset.key]=!s[e.dataset.key];render()},
  wtoggle(e){const s=S.set.pc;s[e.dataset.key]=!s[e.dataset.key];render()},
  setQuick(e){S.set[S.view].quick=e.dataset.q;render()},
  saveTo(){V().sheet={t:'saveTo'};render()},
  setSave(e){S.set[S.view].save=e.dataset.s;render()},
  rename(){V().sheet={t:'rename'};render();setTimeout(()=>{const i=document.getElementById('rename-in');if(i){i.focus();i.select()}},300)},
  saveName(){const v=(document.getElementById('rename-in').value||'').trim();if(!v)return;S.set[S.view].name=v;close();render();notice('Renamed','Your devices now see “'+v+'”')},
  wsec(e){S.pc.sec=+e.dataset.n;render();const t=document.getElementById('s'+e.dataset.n),box=document.getElementById('wset');if(t&&box)box.scrollTo({top:t.offsetTop-box.offsetTop-10,behavior:'smooth'})},
  foundIt(){V().ping=null;render();notice('Found it','The sound stopped on both devices')},
  /* the other devices */
  simFiles(){const v=S.view;const k=v==='phone'?'mbp':'pixel';const d=S.D[k];
    const m={id:nid(),t:'req',from:'them',files:REQ.slice(),status:'waiting',p:0,day:'Today',when:now(),fresh:true};hist(v,k).push(m);stick=true;
    const s=S.set[v];if(s.quick==='on'||(s.quick==='fav'&&d.fav&&false)||s.always[k]){accept(v,k,m.id);notice(d.name+' is sending 4 files','You said it can send without asking');return}
    if(v==='phone'&&!(S.phone.tab==='chat'&&S.phone.chat===k))S.phone.sheet={t:'req',k,id:m.id};render()},
  simLink(){const v=S.view;hist(v,'pixel').push({id:nid(),t:'link',from:'them',url:'https://www.theguardian.com/travel/2026/nov/12/best-winter-breaks',day:'Today',when:now(),fresh:true});stick=true;render();notice('Pixel 9 sent a link','theguardian.com')},
  simNote(){const v=S.view;hist(v,'pixel').push({id:nid(),t:'note',from:'them',text:'Pick up the charger',day:'Today',when:now(),fresh:true});stick=true;render();notice('Pixel 9 sent a note','Pick up the charger')},
  simPing(){const v=S.view;V().ping=v==='phone'?'mbp':'pixel';render()},
  simCode(){const v=S.view;hist(v,'pixel').push({id:nid(),t:'note',from:'them',text:'Your Google verification code is 482913',day:'Today',when:now(),fresh:true});stick=true;render()},
  simOffline(){S.D.pixel.reach=!S.D.pixel.reach;render();notice(S.D.pixel.reach?'Pixel 9 is back':'Pixel 9 is out of reach',S.D.pixel.reach?'Same Wi-Fi · encrypted':'Its chat says how to reconnect')},
  simError(){V().pop={t:'error',k:'mba'};render()},
  simFresh(){const v=S.view;Object.values(S.D).forEach(d=>{if(!d.self)d.paired=false});V().stack=[];if(v==='phone')S.phone.tab='devices';else S.pc.tab='devices';render()},
  reset(){jobs.length=0;const v=S.view;S=fresh();S.view=v;S.pc.remote='mbp';lastKey='';stick=true;for(const k in NQ){NQ[k].q.length=0;NQ[k].cur=null}document.getElementById('ph-notices').innerHTML='';document.getElementById('pc-notices').innerHTML='';render();notice('Started over','Everything is back to how it was')}
};
function openURL(u){const a=document.createElement('a');a.href=/^https?:/.test(u)?u:'https://'+u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
function labels(){const p=S.view==='phone';document.getElementById('sim-files').textContent=p?'MacBook Pro sends 4 files':'Pixel 9 sends 4 files';document.getElementById('sim-ping').textContent=p?'MacBook Pro pings this phone':'Pixel 9 pings this computer'}
/* hold (or right-click, or the Menu key) a card for all its actions; flick a sheet down to close it */
function held(el){el.classList.remove('held');void el.offsetWidth;el.classList.add('held');setTimeout(()=>el.classList.remove('held'),180);try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}}
function actions(el){held(el);V().sheet={t:'menu',id:el.dataset.hold};setTimeout(render,120)}
let hold=null,justHeld=false;
document.addEventListener('pointerdown',ev=>{const el=ev.target.closest('[data-hold]');if(!el||ev.button>0)return;
  hold={el,x:ev.clientX,y:ev.clientY,t:setTimeout(()=>{justHeld=true;hold=null;actions(el)},480)}});
document.addEventListener('pointermove',ev=>{if(hold&&Math.hypot(ev.clientX-hold.x,ev.clientY-hold.y)>8){clearTimeout(hold.t);hold=null}});
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>{if(hold){clearTimeout(hold.t);hold=null}}));
document.addEventListener('contextmenu',ev=>{const el=ev.target.closest&&ev.target.closest('[data-hold]');if(!el)return;ev.preventDefault();if(justHeld){justHeld=false;return}actions(el)});
document.addEventListener('keydown',ev=>{const el=ev.target;if(el.dataset&&el.dataset.hold&&(ev.key==='ContextMenu'||(ev.shiftKey&&ev.key==='F10')||(ev.key==='Enter'&&el===ev.target))){ev.preventDefault();actions(el)}});
let flick=null,flicked=false;
document.addEventListener('pointerdown',ev=>{const sh=ev.target.closest('.sheet');if(!sh||sh.scrollTop>0||ev.target.closest('input,textarea'))return;flick={sh,y:ev.clientY,dy:0}},true);
document.addEventListener('pointermove',ev=>{if(!flick)return;const dy=ev.clientY-flick.y;if(dy>8||flick.dy){flick.dy=Math.max(0,dy);flick.sh.classList.add('drag');flick.sh.style.transform=`translateY(${flick.dy}px)`}});
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>{if(!flick)return;const f=flick;flick=null;if(!f.dy)return;flicked=true;setTimeout(()=>flicked=false,60);f.sh.classList.remove('drag');
  if(f.dy>70){f.sh.classList.add('gone');setTimeout(()=>{close();render()},190)}else{f.sh.classList.add('snap');f.sh.style.transform='';setTimeout(()=>f.sh.classList.remove('snap'),260)}}));
document.addEventListener('click',ev=>{if(flicked){ev.preventDefault();return}if(justHeld){justHeld=false;if(ev.target.closest('[data-hold]')){ev.preventDefault();return}}const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el,ev)});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.dataset.compose){const v=t.dataset.compose;S[v].draft=t.value;const bar=t.closest('.mbar'),on=!!t.value.trim();bar.classList.toggle('typing',on);bar.querySelector('.sendf').setAttribute('aria-label',on?'Send':'Send files')}
  else if(t.dataset.q){S[t.dataset.q].q=t.value;render()}
  else if(t.dataset.bq){S[t.dataset.bq].browse.q=t.value;render()}
  else if(t.hasAttribute('data-code')){const c=V().connect;c.code=t.value.replace(/\D/g,'').slice(0,6);render();if(c.code.length===6)setTimeout(()=>{if(V().connect&&V().connect.code.length===6)A.doConnect()},350)}
  else if(t.dataset.kb){if(t.value)trail('Typing “'+t.value.slice(-24)+'”')}});
document.addEventListener('keydown',ev=>{const t=ev.target;
  if(t.dataset&&t.dataset.compose&&ev.key==='Enter'){ev.preventDefault();sendText(t.dataset.compose,t.value)}
  if(t.id==='kb-pc'&&ev.key==='Enter'){ev.preventDefault();A.kbSendPc()}
  if(t.id==='kb-in'&&ev.key==='Enter'){ev.preventDefault();A.kbSend()}
  if(t.id==='rename-in'&&ev.key==='Enter')A.saveName();
  if(ev.key==='Escape'){const st=V();if(st.sheet){st.sheet=null;render()}else if(st.pop){st.pop=null;render()}}});
let dragN=0;
document.addEventListener('dragenter',ev=>{const m=ev.target.closest&&ev.target.closest('#wchat');if(m){dragN++;m.classList.add('dragging')}});
document.addEventListener('dragleave',ev=>{const m=ev.target.closest&&ev.target.closest('#wchat');if(m&&--dragN<=0){dragN=0;m.classList.remove('dragging')}});
document.addEventListener('dragover',ev=>{if(ev.target.closest&&ev.target.closest('#wchat'))ev.preventDefault()});
document.addEventListener('drop',ev=>{const m=ev.target.closest&&ev.target.closest('#wchat');if(!m)return;ev.preventDefault();dragN=0;m.classList.remove('dragging');const fs=[...(ev.dataTransfer.files||[])].map(f=>({name:f.name,size:f.size||1}));if(fs.length)startSend('pc',S.pc.chat,fs)});
function fit(){const st=document.querySelector('.stage');const avW=Math.max(260,st.clientWidth);const avH=Math.max(480,window.innerHeight-86);
  [['fit-phone',414,868],['fit-pc',1280,800]].forEach(([id,w,h])=>{const f=document.getElementById(id);if(f.hidden)return;const s=Math.max(id==='fit-phone'?.55:.2,Math.min(1,avW/w,id==='fit-phone'?avH/h:9));f.style.width=w*s+'px';f.style.height=h*s+'px';f.firstElementChild.style.transform=`scale(${s})`})}
window.addEventListener('resize',fit);
document.getElementById('st-r').innerHTML=ic('wifi',17,'currentColor',2.4)+'<span class="batt"><i></i></span>';
['a','b','c','d','e','f','g','h'].forEach((x,i)=>{document.getElementById('ic-'+x).innerHTML=ic(['send','link','chat','ping','wifi','alert','devices','copy'][i],18,'var(--amber)')});
labels();render();fit();setTimeout(fit,60);
})();
</script>
